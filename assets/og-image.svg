  <text x="270" y="350" text-anchor="middle" fill="#E8431A" font-family="Arial, sans-serif" font-size="112" font-weight="900" letter-spacing="-8">IT</text>
  <text x="280" y="398" text-anchor="middle" fill="#73120C" font-family="Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="9">FEST</text>
  <text x="395" y="418" text-anchor="end" fill="#E8431A" font-family="Arial, sans-serif" font-size="25" font-weight="800" letter-spacing="3">III</text>
  <text x="500" y="242" fill="#FFD7CB" font-family="Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="9">WELCOME TO</text>
  <text x="494" y="334" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="65" font-weight="800" letter-spacing="-2">MAKE IT FEST III</text>
