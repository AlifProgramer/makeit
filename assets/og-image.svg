  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1100" cy="70" r="300" fill="url(#glow)"/>
  <circle cx="100" cy="620" r="280" fill="url(#glow)" opacity=".45"/>
